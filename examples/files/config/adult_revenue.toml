[dataset]
loader = 'csv'
files = ['examples/files/dataset/adult/adult.data.csv']
show_columns = true
plugins = ['examples.open_ml', 'examples.files']

[preprocess]
label = 'income'  # The actual label column in adult dataset
y_preprocessors = [
    'binary_revenue'  # Use our new binary revenue preprocessor
]
# Remove label_encode since we're using the y_preprocessor
# label_encode = true

# Adult dataset preprocessing
transformers.passthrough = [
    'age',
    'fnlwgt',
    'education-num',
    'capital-gain',
    'capital-loss',
    'hours-per-week'
]
transformers.one_hot_encoder = [
    'workclass',
    'education',
    'marital-status',
    'occupation',
    'relationship',
    'race',
    'sex',
    'native-country'
]

# The shuffle value is its random_state seed.
preprocessors.shuffle = 1
# Negative values start at the end:
preprocessors.drop_rows = -5
# Dropped samples left out for predictions (relevant for testing the final model),
# file path will be the on specified in training predict_file.
drop_rows_to_predict_file = true

# Pipeline suffixes are removed from columns by default:
verbose_feature_names_out = false

# Multiple files will be combined, by default the "index" axis is used.
# If 'index' axis is used, a group column with the filename will be added.
# If 'column' axis is used, no grouping will occur.
files_axis = 'index'

[eda]
enabled = false
show_plots = true
save_images = false
save_timestamp = true
images_extension = 'png'
images_directory = 'output/eda'
plots = [
  'distribution_y',
]
figsize = [20, 15]
dpi = 200

[training]
enabled = true
pipeline = 'imblearn.pipeline'
samplers = [
    'sampler/tomek_links',
]
estimators = [
    'classifier/kneighbors_classifier',
    'classifier/logistic_regression',
]
runners = [
    'score',
    'classification_report',
]
scoring = 'f1'

splitting_method.kfold_stratified = 3

save_model = true
model_timestamp = false
models_directory = 'tests/models'
# Use a random seed (default) or specify one
seed = 7368298

[predictions]
predict_file = 'tests/adult_revenue/predictions.csv'
loader = 'csv'
preprocess = false
enabled = true
objective = 'binary'
threshold = 0.5
save_predictions = true
predictions_directory = 'tests/adult_revenue/predictions'
predictions_timestamp = false
keep_data = false
